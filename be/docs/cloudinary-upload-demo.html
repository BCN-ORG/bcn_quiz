<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinIO upload demo</title>
<h1>MinIO upload demo</h1>
<p>Dán payload từ endpoint xin chữ ký, chọn file và upload. Xem <a href="../DEPLOY.md">hướng dẫn frontend</a>.</p>
<label for="policy">Response xin chữ ký (payload hoặc envelope có data)</label><br>
<textarea id="policy" rows="12" cols="65"></textarea><br>
<label for="file">File</label> <input id="file" type="file"><br>
<button id="upload">Upload</button>
<pre id="result" aria-live="polite"></pre>
<script>
const uploadButton = document.getElementById('upload');
uploadButton.addEventListener('click', async () => {
  const output = document.getElementById('result');
  uploadButton.disabled = true;
  try {
    const response = JSON.parse(document.getElementById('policy').value);
    const policy = response.data || response;
    const file = document.getElementById('file').files[0];
    if (policy.provider !== 'minio' || policy.method !== 'PUT' || !policy.uploadUrl) throw new Error('Response MinIO không hợp lệ');
    if (!file || !file.size || file.size > policy.maxBytes) throw new Error('Chọn file có dung lượng trong giới hạn');
    const uploaded = await fetch(policy.uploadUrl, { method: 'PUT', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file });
    if (!uploaded.ok) throw new Error(`Upload thất bại: HTTP ${uploaded.status}`);
    output.textContent = JSON.stringify({ secureUrl: policy.secureUrl, publicId: policy.publicId, downloadUrl: policy.downloadUrl, originalName: file.name, mimeType: file.type, fileSize: file.size }, null, 2);
  } catch (error) {
    output.textContent = error.message;
  } finally {
    uploadButton.disabled = false;
  }
});
</script>
</html>
