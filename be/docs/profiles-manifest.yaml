# Import trên Profiles: Admin → ứng dụng QUIZ → Manifest.
# Catalog này là nguồn đăng ký. Profiles chỉ grant/revoke các mã dưới đây.
# Thêm role hoặc permission mới: sửa file này rồi import lại.

app:
  code: QUIZ
  name: BCN Quiz
  clientId: bcn-quiz

auth:
  accessMode: MEMBERS
  require2FA: false
  redirectUri: https://quizzes.bcn.id.vn/api/auth/callback

roles:
  - code: MEMBER
    name: Học viên
    description: Làm bài và xem lịch sử của chính mình
  - code: MENTOR
    name: Mentor
    description: Tạo và sửa nội dung, duyệt project, không xóa
  - code: ADMIN
    name: Quản trị
    description: Toàn bộ quyền của app Quiz

permissions:
  - code: quiz.question.read
    description: Xem khóa học và làm bài
  - code: quiz.question.create
    description: Tạo khóa học, chủ đề và câu hỏi
  - code: quiz.question.update
    description: Sửa nội dung và duyệt project
  - code: quiz.question.delete
    description: Xóa khóa học, chủ đề và câu hỏi
  - code: quiz.result.read
    description: Xem lịch sử làm bài của chính mình

rolePermissions:
  MEMBER:
    - quiz.question.read
    - quiz.result.read
  MENTOR:
    - quiz.question.read
    - quiz.question.create
    - quiz.question.update
    - quiz.result.read
  ADMIN:
    - quiz.question.read
    - quiz.question.create
    - quiz.question.update
    - quiz.question.delete
    - quiz.result.read
