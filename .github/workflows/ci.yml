name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: be/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npm test -- --runInBand --forceExit
      - run: node --test scripts/generate-production-env.test.mjs
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://quizzes.bcn.id.vn/api
          NEXT_PUBLIC_PROFILES_APP_URL: https://profiles.bcn.id.vn
      - run: pnpm audit --prod --audit-level high
